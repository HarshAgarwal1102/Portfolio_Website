name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: this workflow never deploys and needs no secrets.
permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Links, assets, CSP, secrets & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Static site checks
        run: node scripts/check-site.mjs

      - name: Unit tests
        run: node --test tests/
